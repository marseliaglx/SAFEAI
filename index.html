        "address": { "@type": "PostalAddress", "addressLocality": "Cork", "addressCountry": "IE" },
        "founder": { "@type": "Person", "name": "Marcela", "nationality": "Polish" },

      },
      {

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="safeai-components.jsx"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <style>
    html, body { margin: 0; padding: 0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "heroHeadline": "Using AI in your organisation?",
  "heroSub": "The EU AI Act may already apply to you.",
  "primaryCTA": "Download the Free AI Risk Checklist",
  "secondaryCTA": "Book AI Training",
  "showBlog": true,
  "showGuides": true,
  "showQuiz": true,
  "accentColor": "#1B9AAA"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    if (tweaks && tweaks.accentColor) {
      document.documentElement.style.setProperty('--teal-override', tweaks.accentColor);
    }
  }, [tweaks && tweaks.accentColor]);

  return (
    <>
      <Navbar />
      <HeroSection />
      <SocialProofBar />
      <ProblemSection />
      {tweaks.showQuiz && <QuizSection />}
      <ServicesSection />
      <FreeToolsSection />
      {tweaks.showGuides && <GuidesSection />}
      <OfficialResourcesSection />
      {tweaks.showBlog && <BlogSection />}
      <AboutSection />
      <PolskiSection />
      <FAQSection />
      <CTAStrip />
      <NewsletterSection />
      <Footer />

      <BookingModal />
      <CookieBanner />
      <WhatsAppButton />

      <TweaksPanel>
        <TweakSection title="Content">
          <TweakText id="heroHeadline" label="Hero headline" value={tweaks.heroHeadline} onChange={v => setTweak('heroHeadline', v)} />
          <TweakText id="heroSub" label="Hero sub-headline" value={tweaks.heroSub} onChange={v => setTweak('heroSub', v)} />
          <TweakText id="primaryCTA" label="Primary CTA" value={tweaks.primaryCTA} onChange={v => setTweak('primaryCTA', v)} />
          <TweakText id="secondaryCTA" label="Secondary CTA" value={tweaks.secondaryCTA} onChange={v => setTweak('secondaryCTA', v)} />
        </TweakSection>
        <TweakSection title="Sections">
          <TweakToggle id="showQuiz" label="Show Risk Checker" value={tweaks.showQuiz} onChange={v => setTweak('showQuiz', v)} />
          <TweakToggle id="showGuides" label="Show Guides section" value={tweaks.showGuides} onChange={v => setTweak('showGuides', v)} />
          <TweakToggle id="showBlog" label="Show Blog section" value={tweaks.showBlog} onChange={v => setTweak('showBlog', v)} />
        </TweakSection>
        <TweakSection title="Brand">
          <TweakColor id="accentColor" label="Accent colour" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
