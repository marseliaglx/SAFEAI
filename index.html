<div id="root"></div>
<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showQuiz": true,
  "showBlog": true,
  "accentColor": "#C66B3D"
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  React.useEffect(() => {
    if (tweaks && tweaks.accentColor) {
      document.documentElement.style.setProperty('--terra', tweaks.accentColor);
    }
  }, [tweaks && tweaks.accentColor]);

  return (
    <>
      <Navbar />
      <main>
        <HeroSection />
        {tweaks.showQuiz && <QuizSection />}
        <ArtifactsSection />
        <ProductsSection />
        <AudienceSection />
        <HowItWorksSection />
        <AboutSection />
        <PolskiSection />
        <FAQSection />
        <FinalCTASection />
        {tweaks.showBlog && <BlogSection />}
      </main>
      <Footer />

      <BookingModal />
      <CookieBanner />
      <WhatsAppButton />

      <TweaksPanel>
        <TweakSection title="Sections">
          <TweakToggle id="showQuiz" label="Show Quiz" value={tweaks.showQuiz} onChange={v => setTweak('showQuiz', v)} />
          <TweakToggle id="showBlog" label="Show Blog" value={tweaks.showBlog} onChange={v => setTweak('showBlog', v)} />
        </TweakSection>
        <TweakSection title="Brand">
          <TweakColor id="accentColor" label="Accent colour" value={tweaks.accentColor} onChange={v => setTweak('accentColor', v)} />
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
