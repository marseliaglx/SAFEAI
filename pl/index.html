<script type="text/babel">

/* ── Design tokens ── */
const T = {
  paper:     '#FAF7F2',

  ink:       '#0F2A44',
  inkSoft:   '#2A4360',

/* ── Formspree (same ID as main site) ── */
const FORMSPREE_ID = 'YOUR_FORMSPREE_ID';
function submitEmail(email, source) {
  if (!email || FORMSPREE_ID === 'YOUR_FORMSPREE_ID') return Promise.resolve();
  return fetch('https://formspree.io/f/' + FORMSPREE_ID, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, source }),
  }).catch(() => {});
}

/* ── Base styles ── */
(function() {
  if (document.getElementById('safeai-base-pl')) return;
  const s = document.createElement('style');
  s.id = 'safeai-base-pl';
  s.textContent = `
    :root {
      --paper:      #FAF7F2;
      --paper-warm: #F2EDE2;
      --ink:        #0F2A44;
      --ink-soft:   #2A4360;

      --sage-dark:  #3D5E4F;

      --terra-dark: #A2552E;
      --grey:       #6B6F76;
      --line:       #E5E0D6;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body { font-family: 'Hanken Grotesk', sans-serif; color: var(--ink); background: var(--paper); }
    h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 600; line-height: 1.2; }
    :focus-visible { outline: 2px solid var(--terra); outline-offset: 2px; }

    .sa-kicker {
      font-family: 'Fraunces', serif; font-style: italic;
      font-size: 12px; font-weight: 400; letter-spacing: 0.05em;
      color: var(--terra); margin-bottom: 16px; display: block;
    }
    .sa-btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--terra); color: #fff; font-family: 'Hanken Grotesk', sans-serif;
      font-weight: 600; font-size: 15px; padding: 14px 28px; border-radius: 4px;
      border: none; cursor: pointer; text-decoration: none;
      transition: background 0.18s, transform 0.12s;
    }
    .sa-btn-primary:hover { background: var(--terra-dark); transform: translateY(-1px); }
    .sa-btn-outline {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: var(--ink); font-family: 'Hanken Grotesk', sans-serif;
      font-weight: 600; font-size: 15px; padding: 13px 28px; border-radius: 4px;
      border: 2px solid var(--line); cursor: pointer; text-decoration: none;
      transition: border-color 0.18s;
    }
    .sa-btn-outline:hover { border-color: var(--ink); }
    .sa-section { padding: 80px 24px; }
    @media (max-width: 768px) { .sa-section { padding: 56px 24px; } }
    .sa-max { max-width: 1180px; margin: 0 auto; }
    .sa-input {
      flex: 1; padding: 13px 16px; border-radius: 4px;
      border: 1.5px solid var(--line); background: var(--paper);
      font-family: 'Hanken Grotesk', sans-serif; font-size: 14px; color: var(--ink);
    }
    .sa-input:focus { outline: none; border-color: var(--terra); }
    .sa-input::placeholder { color: var(--grey); }

    details.faq-item { border-bottom: 1px solid var(--line); }
    details.faq-item summary {
      cursor: pointer; padding: 20px 0; list-style: none;
      display: flex; justify-content: space-between; align-items: center; gap: 16px;
      font-family: 'Hanken Grotesk', sans-serif; font-size: 15px; font-weight: 600;
      color: var(--ink); line-height: 1.5;
    }
    details.faq-item summary::-webkit-details-marker { display: none; }
    details.faq-item summary::after {
      content: '+'; flex-shrink: 0; font-size: 22px; font-weight: 300;

      transition: transform 0.22s; line-height: 1;
    }
    details.faq-item[open] summary::after { transform: rotate(45deg); }
    details.faq-item .faq-body {
      padding: 0 48px 20px 0; font-family: 'Hanken Grotesk', sans-serif;

    .blog-card { transition: box-shadow 0.2s, transform 0.2s; }
    .blog-card:hover { box-shadow: 0 6px 24px rgba(15,42,68,0.08); transform: translateY(-2px); }

    .sa-nav-links { display: flex; align-items: center; gap: 28px; }
    .sa-hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; color: var(--ink); }

    }
    .about-grid { display: flex; gap: 56px; align-items: flex-start; flex-wrap: wrap; }
    .about-photo { flex: 0 0 260px; min-width: 200px; max-width: 300px; }
    .about-text { flex: 1 1 380px; min-width: 0; }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 32px; margin-bottom: 40px; }
    @media (max-width: 768px) { .footer-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 480px) { .footer-grid { grid-template-columns: 1fr; } }
  `;
  document.head.appendChild(s);
})();

/* ── Navbar (PL) ── */
function Navbar() {
  const R = React;
  const [scrolled, setScrolled] = R.useState(false);
  const [mobileOpen, setMobileOpen] = R.useState(false);
  R.useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 60);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);
  const links = [
    { label: 'Produkty', href: '#produkty' },
    { label: 'Dla kogo', href: '#dla-kogo' },
    { label: 'O mnie', href: '#o-mnie' },
    { label: 'FAQ', href: '#faq' },
  ];
  return (
    <header>
      <nav style={{
        position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
        background: scrolled || mobileOpen ? 'rgba(250,247,242,0.97)' : 'transparent',
        backdropFilter: scrolled || mobileOpen ? 'blur(8px)' : 'none',
        borderBottom: scrolled ? `1px solid ${T.line}` : 'none',
        transition: 'background 0.3s, border-color 0.3s',
      }}>
        <div style={{ maxWidth: 1180, margin: '0 auto', padding: '0 24px', minHeight: 64, display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24 }}>
          <a href="/" aria-label="SafeAI — strona główna (angielska)" style={{ display: 'flex', alignItems: 'center', textDecoration: 'none' }}>
            <img src="../safeai-logo.svg" alt="SafeAI" style={{ height: 40, width: 'auto' }} />
          </a>
          <div className="sa-nav-links">
            {links.map(l => (
              <a key={l.label} href={l.href}
                style={{ fontSize: 14, fontWeight: 500, color: T.inkSoft, textDecoration: 'none', transition: 'color 0.15s', fontFamily: "'Hanken Grotesk', sans-serif" }}
                onMouseEnter={e => e.currentTarget.style.color = T.terra}
                onMouseLeave={e => e.currentTarget.style.color = T.inkSoft}>
                {l.label}
              </a>
            ))}
            <a href="/" lang="en" aria-label="English version" style={{
              fontSize: 12, fontWeight: 700, color: T.terra, fontFamily: "'Hanken Grotesk', sans-serif",
              border: `1.5px solid ${T.terra}`, borderRadius: 20, padding: '5px 14px',
              textDecoration: 'none', letterSpacing: '0.04em', transition: 'background 0.15s, color 0.15s',
            }}
            onMouseEnter={e => { e.currentTarget.style.background = T.terra; e.currentTarget.style.color = '#fff'; }}
            onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = T.terra; }}>
              English
            </a>
          </div>
          <button className="sa-hamburger" onClick={() => setMobileOpen(!mobileOpen)} aria-label="Otwórz menu" aria-expanded={mobileOpen}>
            {mobileOpen
              ? <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M17 5L5 17M5 5l12 12" stroke={T.ink} strokeWidth="2" strokeLinecap="round"/></svg>
              : <svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M3 7h16M3 11h16M3 15h16" stroke={T.ink} strokeWidth="2" strokeLinecap="round"/></svg>
            }
          </button>
        </div>
        {mobileOpen && (
          <nav className="sa-mobile-menu" aria-label="Menu mobilne">
            {links.map(l => <a key={l.label} href={l.href} className="sa-mobile-link" onClick={() => setMobileOpen(false)}>{l.label}</a>)}
            <a href="/" className="sa-mobile-link" lang="en" onClick={() => setMobileOpen(false)} style={{ color: T.terra }}>English</a>
          </nav>
        )}
      </nav>
    </header>
  );
}

    { q: 'Czy masz pisemną Politykę Akceptowalnego Użytkowania AI?', opts: ['Tak, podpisaną przez wszystkich', 'Mam szkic, ale nie jest podpisany', 'Nie'], risk: [-1, 0, 1] },
    { q: 'Czy ty lub twoi pracownicy ukończyliście szkolenie z AI w ciągu ostatnich 12 miesięcy?', opts: ['Tak, z dokumentacją', 'Nieformalnie, bez dokumentacji', 'Nie'], risk: [-1, 0.5, 1] },
    { q: 'Czy masz listę narzędzi AI używanych w swojej firmie?', opts: ['Tak, pełna lista', 'Częściowa lista', 'Nie'], risk: [-1, 0, 1] },
    { q: 'Czy pracownicy wklejają dane klientów do narzędzi AI?', opts: ['Tak, regularnie', 'Czasami', 'Nigdy'], risk: [1, 0.5, 0] },
    { q: 'Czy pracownicy podpisali cokolwiek dotyczącego używania AI w pracy?', opts: ['Tak, wszyscy podpisali', 'Niektórzy', 'Nie'], risk: [-1, 0, 1] },
    { q: 'Czy każdy w zespole wie, które narzędzia AI są dozwolone, a które nie?', opts: ['Tak, jest to zapisane', 'Mniej więcej wiedzą', 'Nie'], risk: [-1, 0, 1] },
    { q: 'Czy podjęłeś/podjęłaś kroki dotyczące zgodności z Artykułem 4 od 2 lutego 2025 roku?', opts: ['Tak, mam dokumentację', 'Wiem o tym, ale jeszcze nic nie zrobiłem/am', 'Nie / nie wiedziałem/am o terminie'], risk: [-1, 0.5, 1] },
  ];
  const [step, setStep] = React.useState(0);
  const [answers, setAnswers] = React.useState(new Array(questions.length).fill(null));
  const [email, setEmail] = React.useState('');
  const [emailSent, setEmailSent] = React.useState(false);

  function pick(i) {
    const a = [...answers]; a[step] = i; setAnswers(a);
    if (step < questions.length - 1) setStep(step + 1);
    else setStep(questions.length);
  }
  function calcScore() { return answers.reduce((s, a, i) => a === null ? s : s + (questions[i].risk[a] || 0), 0); }
  function getRisk(s) { if (s <= 1) return 'Niskie'; if (s <= 4) return 'Średnie'; return 'Wysokie'; }
  function getGaps() {
    const g = [];
    if (answers[1] === 2) g.push('Brak pisemnej Polityki Akceptowalnego Użytkowania AI');
    if (answers[2] >= 1) g.push('Brak udokumentowanego szkolenia z umiejętności AI');
    if (answers[3] >= 1) g.push('Brak rejestru narzędzi AI używanych w firmie');
    if (answers[5] >= 1) g.push('Pracownicy nie podpisali umowy dotyczącej używania AI');
    if (answers[7] >= 1) g.push('Brak dokumentacji zgodności z Artykułem 4 po lutym 2025');
    return g;
  }
  const riskMeta = {
    'Niskie':  { bg: '#F0F4F1', text: T.sageDark, border: T.sage },
    'Średnie': { bg: '#FFF8F2', text: '#7A3A18', border: T.terra },
    'Wysokie': { bg: '#FFF4F0', text: '#7A2010', border: '#C0402A' },
  };
  const riskText = {
    'Niskie':  'Podjęłeś/aś już pewne kroki. Krótki przegląd potwierdzi, że spełniasz wymogi Artykułu 4.',
    'Średnie': 'Twoje używanie AI tworzy pewne luki zgodnie z Artykułem 4. Można je łatwo usunąć odpowiednimi szablonami.',
    'Wysokie': 'Twoja obecna sytuacja stwarza realne ryzyko zgodnie z Artykułem 4. To częsty przypadek — i można to naprawić Pakietem SafeAI.',
  };
  const score = step === questions.length ? calcScore() : null;
  const risk = score !== null ? getRisk(score) : null;
  function restart() { setStep(0); setAnswers(new Array(questions.length).fill(null)); setEmail(''); setEmailSent(false); }

  return (
    <section id="quiz" className="sa-section" style={{ background: T.paperWarm, borderTop: `1px solid ${T.line}`, borderBottom: `1px solid ${T.line}` }}>
      <div style={{ maxWidth: 680, margin: '0 auto' }}>
        <div style={{ textAlign: 'center', marginBottom: 36 }}>
          <span className="sa-kicker" style={{ textAlign: 'center' }}>2-minutowy test ryzyka AI</span>
          <h2 style={{ fontSize: 'clamp(24px, 3vw, 36px)', color: T.ink, marginBottom: 10 }}>
            Sprawdź gdzie stoisz z Artykułem 4
          </h2>
          <p style={{ fontSize: 14, color: T.grey, fontFamily: "'Hanken Grotesk', sans-serif" }}>
            8 pytań · wynik od razu · bez e-maila
          </p>
        </div>
        <div style={{ background: T.paper, border: `1.5px solid ${T.line}`, borderRadius: 6, padding: '32px 36px' }}>
          {step < questions.length ? (
            <>
              <div style={{ marginBottom: 28 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                  <span style={{ fontSize: 12, color: T.grey, fontFamily: "'Hanken Grotesk', sans-serif" }}>Pytanie {step + 1} z {questions.length}</span>
                  <span style={{ fontSize: 12, color: T.terra, fontWeight: 600, fontFamily: "'Hanken Grotesk', sans-serif" }}>{Math.round(((step + 1) / questions.length) * 100)}%</span>
                </div>
                <div style={{ height: 3, background: T.line, borderRadius: 2, overflow: 'hidden' }}>
                  <div style={{ width: `${((step + 1) / questions.length) * 100}%`, height: '100%', background: T.terra, borderRadius: 2, transition: 'width 0.4s ease' }} />
                </div>
              </div>
              <h3 style={{ fontFamily: "'Hanken Grotesk', sans-serif", fontSize: 17, fontWeight: 600, color: T.ink, marginBottom: 20, lineHeight: 1.5 }}>{questions[step].q}</h3>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                {questions[step].opts.map((o, i) => (
                  <button key={i} className="quiz-opt" onClick={() => pick(i)}
                    style={{ padding: '14px 18px', background: T.paper, border: `1.5px solid ${T.line}`, borderRadius: 4, fontSize: 14, color: T.ink, textAlign: 'left', cursor: 'pointer', fontFamily: "'Hanken Grotesk', sans-serif", transition: 'all 0.15s' }}>
                    {o}
                  </button>
                ))}
              </div>
            </>
          ) : (
            <>
              <div style={{ textAlign: 'center', marginBottom: 24 }}>
                <span style={{ display: 'inline-block', padding: '8px 24px', borderRadius: 3, background: riskMeta[risk].bg, color: riskMeta[risk].text, border: `1.5px solid ${riskMeta[risk].border}`, fontFamily: "'Fraunces', serif", fontSize: 18, fontStyle: 'italic' }}>
                  {risk} ryzyko
                </span>
              </div>
              <p style={{ fontSize: 15, color: T.ink, lineHeight: 1.85, marginBottom: 20, textAlign: 'center', fontFamily: "'Hanken Grotesk', sans-serif" }}>{riskText[risk]}</p>
              {getGaps().length > 0 && (
                <div style={{ background: T.paperWarm, border: `1px solid ${T.line}`, borderRadius: 4, padding: '16px 20px', marginBottom: 24 }}>
                  <p style={{ fontSize: 12, fontWeight: 700, color: T.ink, marginBottom: 10, letterSpacing: '0.08em', textTransform: 'uppercase', fontFamily: "'Hanken Grotesk', sans-serif" }}>Znalezione luki:</p>
                  {getGaps().map((g, i) => (
                    <div key={i} style={{ display: 'flex', gap: 10, alignItems: 'flex-start', marginBottom: 6 }}>
                      <span style={{ color: T.terra, fontSize: 14, flexShrink: 0, lineHeight: 1.6 }}>→</span>
                      <span style={{ fontSize: 13, color: T.inkSoft, lineHeight: 1.6, fontFamily: "'Hanken Grotesk', sans-serif" }}>{g}</span>
                    </div>
                  ))}
                </div>
              )}
              <div style={{ textAlign: 'center', marginBottom: 24 }}>
                <a href="#produkty" className="sa-btn-primary" style={{ fontSize: 15, padding: '14px 28px' }}>
                  Zobacz produkty, które uzupełnią luki <Icon.Arrow size={15} color="#fff" />
                </a>
              </div>
              <div style={{ paddingTop: 20, borderTop: `1px solid ${T.line}` }}>
                {!emailSent ? (
                  <>
                    <p style={{ fontSize: 13, color: T.grey, marginBottom: 12, fontFamily: "'Hanken Grotesk', sans-serif" }}>Opcjonalnie: wyślij wyniki na e-mail. Odpiszemy tylko jeśli o to poprosisz.</p>
                    <div style={{ display: 'flex', gap: 10 }}>
                      <input type="email" className="sa-input" placeholder="twoj@email.ie" value={email} onChange={e => setEmail(e.target.value)} />
                      <button className="sa-btn-primary" style={{ fontSize: 14, padding: '13px 18px', flexShrink: 0 }} onClick={() => { if (email) { submitEmail(email, 'quiz-pl'); setEmailSent(true); } }}>Wyślij</button>
                    </div>
                  </>
                ) : (
                  <p style={{ fontSize: 14, color: T.sageDark, fontFamily: "'Hanken Grotesk', sans-serif" }}>✓ Wysłano — sprawdź skrzynkę.</p>
                )}
              </div>
              <div style={{ marginTop: 16, textAlign: 'center' }}>
                <button onClick={restart} style={{ fontSize: 12, color: T.grey, background: 'none', border: 'none', cursor: 'pointer', fontFamily: "'Hanken Grotesk', sans-serif", textDecoration: 'underline' }}>Zacznij od nowa</button>
              </div>
            </>
          )}
        </div>
      </div>
    </section>
  );
}

/* ── Cookie Banner ── */
function CookieBanner() {
  const R = React;
  const [visible, setVisible] = R.useState(false);
  R.useEffect(() => { setVisible(!localStorage.getItem('safeai-cookie-ok')); }, []);
  function accept() { localStorage.setItem('safeai-cookie-ok', '1'); setVisible(false); }
  if (!visible) return null;
  return (
    <div role="dialog" aria-label="Zgoda na pliki cookie" style={{ position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 500, background: T.ink, padding: '14px 24px', display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap', borderTop: '1px solid rgba(250,247,242,0.1)' }}>
      <p style={{ fontSize: 13, color: 'rgba(250,247,242,0.75)', lineHeight: 1.6, flex: 1, margin: 0, fontFamily: "'Hanken Grotesk', sans-serif" }}>
        Używamy niezbędnych plików cookie. Kontynuując, zgadzasz się z naszą{' '}
        <a href="../privacy.html" style={{ color: T.terra, textDecoration: 'none' }}>Polityką prywatności</a>.
      </p>
      <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>
        <button onClick={accept} className="sa-btn-primary" style={{ fontSize: 13, padding: '9px 20px' }}>Akceptuj</button>
        <button onClick={accept} style={{ fontSize: 13, color: 'rgba(250,247,242,0.5)', background: 'none', border: 'none', cursor: 'pointer', fontFamily: "'Hanken Grotesk', sans-serif", padding: '9px 4px' }}>Odrzuć</button>
      </div>
    </div>
  );
}

/* ── Booking Modal ── */
function BookingModal() {
  const R = React;
  const [open, setOpen] = R.useState(false);
  R.useEffect(() => {
    function check() { setOpen(window.location.hash === '#booking'); }
    check();
    window.addEventListener('hashchange', check);
    return () => window.removeEventListener('hashchange', check);
  }, []);
  function close() { window.history.replaceState(null, '', window.location.pathname + window.location.search); setOpen(false); }
  if (!open) return null;
  return (
    <div onClick={close} style={{ position: 'fixed', inset: 0, background: 'rgba(15,42,68,0.65)', zIndex: 300, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 24 }}>
      <div onClick={e => e.stopPropagation()} style={{ background: T.paper, borderRadius: 6, width: '100%', maxWidth: 780, height: '88vh', position: 'relative', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
        <div style={{ padding: '14px 20px', borderBottom: `1px solid ${T.line}`, display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
          <span style={{ fontSize: 15, fontWeight: 600, color: T.ink, fontFamily: "'Hanken Grotesk', sans-serif" }}>Umów rozmowę z Marcelą</span>
          <button onClick={close} style={{ background: 'none', border: 'none', fontSize: 22, cursor: 'pointer', color: T.grey, lineHeight: 1, padding: '0 4px' }} aria-label="Zamknij">&times;</button>
        </div>
        <iframe src="https://cal.com/safeai/call?embed=true" style={{ flex: 1, border: 'none', width: '100%' }} title="Umów rozmowę z Marcelą" />
      </div>
    </div>
  );
}
